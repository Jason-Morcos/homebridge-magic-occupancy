# Publishes the package to npm when a GitHub release is created.
# Uses npm trusted publishing (OIDC) — no npm token secret is needed.
# Requires a trusted publisher for this repo + workflow file to be configured
# on npmjs.com (package Settings → Trusted publishing).

name: Node.js Package

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      # Trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm publish --access public
